# ============================================================================
# AuthorizationPolicy — Giới hạn service-to-service communication
# Label: app.kubernetes.io/name (khớp Helm chart)
# SA name: fullnameOverride từ values.yaml
# ============================================================================

# ── DENY ALL (Default) ──
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: dev
spec:
  {}
---
# ── storefront-bff → product ──
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-storefront-to-product
  namespace: dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: product
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/dev/sa/storefront-bff"]
---
