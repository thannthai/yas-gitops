# ============================================================================
# Bước 3: DestinationRule — Yêu cầu mTLS cho từng service (client-side)
# Đảm bảo cả phía gọi cũng sử dụng ISTIO_MUTUAL TLS
# ============================================================================

# --- Dev namespace ---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: product-mtls
  namespace: dev
spec:
  host: product.dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
