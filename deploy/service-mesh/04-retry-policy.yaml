# ============================================================================
# Bước 4: VirtualService — Retry Policy (auto retry khi lỗi 5xx)
# Khi service trả lỗi 500/502/503/504, Envoy sẽ tự động retry 3 lần
# ============================================================================

# --- Dev namespace ---

# Product service retry
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: product-retry
  namespace: dev
spec:
  hosts:
    - product
  http:
    - route:
        - destination:
            host: product
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure,retriable-4xx
---
